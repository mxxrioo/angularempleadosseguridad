<h1 style="color:blue">Login de empleados</h1>
<form #loginForm="ngForm" (ngSubmit)="login()">
  <label for="usuario">Usuario:</label><br />
  <input id="usuario" name="usuario" [(ngModel)]="usuario.userName" required pattern=".*\S.*" autocomplete="username" /><br /><br />
  <label for="password">Contraseña:</label><br />
  <input id="password" name="password" type="password" [(ngModel)]="usuario.password" required autocomplete="current-password" /><br /><br />
  <button type="submit" [disabled]="loginForm.invalid || cargando">
    {{ cargando ? 'Entrando...' : 'Iniciar sesión' }}
  </button>
</form>
@if (mensaje) {
  <p style="color:red" role="alert">{{mensaje}}</p>
}
